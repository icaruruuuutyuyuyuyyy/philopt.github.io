                body: `
                    <p>A meaningful experience in my life happened when I had to choose between attending my sports training and working on a research project. At that time, our research deadline was at the same day we had to work on it since we had to revise it several times, so our group needed to finish our work as soon as possible. On the same day, I also had a scheduled training for the sport I was practicing. If I went to training first, I would have less time to work on the research, so I decided to prioritize the project. I believed it was the better choice because the deadline was near and I did not want to be a burden my group mates.</p>
                    <p>I made that decision because I felt like i needed to do this research project. It was not only my work, but our leader and other members were also depending on everyone to contribute their part. I knew that if I did not finish my part on time, i would have small contribution and can affect the progress of the whole group. Because of this, I chose to stay focused on the research instead of going to training at the scheduled time. I know that I could attend another training later or some other day, while a missed deadline would be harder to fix. Even though I wanted to train, I believed that finishing something with an important deadline should come first.</p>
                    <p>However, my decision also had a consequence I did not expect. When I finally arrived at training, I was already very late. Because of this, I barely got any training time and was not able to spar with anyone other than my coach. I felt disappointed because I had wanted to learn a lot on every session. I realized that choosing one responsibility sometimes means giving up another opportunity, even when both are important to me. At the same time, I was able to contribute to our research project and avoid making the situation more difficult for my fellow group mates.</p>
                    <p>This experience taught me that freedom of choice does not mean that every decision will have a perfect result but it will also bear consequences no matter how big or small. I was free to choose whether to prioritize my research or my training, but I also had to accept whatever happened because of my decision. It made me realize that having freedom means being responsible for the choices I make instead of blaming other people when things do not go the way I expected. I also learned that making a good decision requires knowing what to prioritize at a certain moment. However, I also learned that I should manage my time better so I do not always have to sacrifice one important responsibility for another.</p>
                    <p>I think my decision was an important learning experience. I learned that choosing what to prioritize is part of growing up and becoming more responsible. I also learned that even when I make a decision for a good reason, it can still have consequences that I may not like. What matters is that I learn from the result and make better decisions in the future. This experience helped me learn that freedom of choice is not only about doing whatever I want, but about making decisions, accepting their consequences, and learning from them.</p>

                body: `
                    <div class="mb-4 text-xs font-bold cabahug-meta uppercase">
                        Submitted: 9/21/2026 12-HUMSS2502 <br>

                    </div>
                    <p class="cabahug-text-blue">The glow of my computer monitor illuminated the walls of my room, casting long shadows as I sat deeply engrossed in developing my latest video game. It was a typical afternoon in my urban neighborhood, and I was comfortably secluded in my own digital world, shaping virtual realities where I controlled every variable. However, the predictable silence of my room was suddenly broken. Faintly at first, and then with growing intensity, I heard a chorus of cheers erupting from a gymnasium situated a bit far from my home. The sound was unusual for that time of day, pulling my attention away from the lines of code on my screen and anchoring me back to the physical world outside my window.</p>
                    <p class="cabahug-text-teal">At that moment, I was faced with a seemingly mundane choice: I could easily put my headphones back on, ignore the outside world, and continue developing my game in the comfort of my isolation. Alternatively, I could step away from my desk, walk out onto the terrace, and see what the commotion was all about. Up until that point, I had been completely oblivious to anything happening beyond my four walls. Driven by a sudden, nagging curiosity about the unusual noise, I chose the latter. I decided to leave the safety of my virtual environment and walked up to the terrace to check the direction of the cheers.</p>
                    <p class="cabahug-text-wine">What I expected to see was a celebration; what I witnessed instead was a jarring collision with reality. As I scanned the street below, my eyes locked onto a scene I instantly wished I hadn't looked at—a chaotic traffic accident right in the middle of the urban sprawl. The distant cheers from the gym seemed to evaporate, instantly swallowed by the aggressive honking of cars and the rising panic of the gathering crowd. A tingling, cold fear hit my chest when I looked closer at the scene. Among the people involved, I realized that one of the victims who got hurt was a person with a disability. In that agonizing moment, the lesson was clear and unforgiving: life is incredibly fragile, and no matter how much we try to control our personal bubbles, the unpredictable chaos of the real world is always just one glance away.</p>
                    <p class="cabahug-text-blue">In the context of the Philosophy of the Human Person, this experience deeply redefined my understanding of the freedom of choice. While choosing to walk to a terrace seems like an incredibly small decision, it highlights a profound philosophical truth: we are always free to choose between comforting ignorance and stark awareness. I had the absolute freedom to remain in my room, blind to the struggles of others, living exclusively for myself and my projects. By choosing to step outside and look, I exercised my freedom to engage with the reality of the human condition. Freedom of choice is not merely about doing whatever we please; it is about the heavy responsibility that comes when our choices force us to confront truths we cannot unsee, shaping our moral conscience in the process.</p>
                    <p class="cabahug-text-teal">Most importantly, witnessing that vulnerable, disabled individual caught in the crossfire of urban chaos completely shifted my perspective on persons with disabilities (PWDs). While I had the privilege of sitting safely in a secure home, creating games for entertainment, this person was navigating an unforgiving, often inaccessible physical world where a single moment of misfortune could be devastating. This one choice to look over the terrace left a big impact on my heart. It taught me that genuine empathy requires us to step out of our privileged sanctuaries. Moving forward, I am committed to using my freedom of choice not just for personal escape, but to be mindful, aware, and supportive of those who must fight daily battles in a society that too often overlooks them.</p>

                    <p>One of the most meaningful experiences that shaped how I understand freedom, responsibility, and perseverance is the life of my late uncle. He was a survivor of polio, which affected his legs and made it difficult for him to walk and move like other people. Despite this, he never allowed his condition to stop him from living a meaningful life. What inspires me the most is how he chose to focus not on what he could no longer do, but on what he was still capable of doing. He had seven children, and despite the challenges he faced, he worked hard to provide for them and make sure that all seven of them were able to graduate. Seeing how successful his children are today makes me realize how much sacrifice and determination he must have had as a father.</p>
                    <p>His story also taught me that our freedom to choose comes with responsibility. My uncle could have easily felt defeated because of his disability, but he chose to continue providing for his family and eventually chose to serve his community. He ran for barangay konsehal and was elected for three consecutive terms. For me, that was a powerful example that a person’s disability does not determine their ability to lead or contribute to society. His decision to serve showed that he wanted to use whatever abilities and opportunities he had to help other people. It also changed how I look at persons with disabilities and people from underprivileged sectors. Instead of seeing them based on their limitations, I learned that we should recognize their abilities, experiences, and potential. My uncle proved that being physically limited does not mean being incapable.</p>
                    <p>Looking back at his life, I realized that freedom is not simply about being able to do whatever we want. It is also about choosing to do what is right even when circumstances are difficult and understanding how our choices affect other people. My uncle’s choices affected not only his own life but also the lives of his seven children and the people in his barangay. Although he is no longer with us, the life he lived continues to inspire me. He showed me that challenges can make life harder, but they do not have to decide our future. His perseverance as a father and his willingness to serve as a leader taught me that we should use our freedom responsibly and never underestimate what a person can achieve just because of a disability.</p>

                title: "A bridge between satisfaction and regret",
                date: "September 20, 2026",
                signature: "Sebastienne Emmanuel R. Dorado • 12 HUMSS",
                body: `
                    <p class="font-bold italic">"Is it better to speak or die?"</p>
                    <p>That has been the question that's been lingering on my mind till this very day...This particular significant of an event (or in retrospect, a whole new learning experience) taught me you should tell the person to whom you feel any sort of romantic feelings for, that you love them. Now, you're probably wondering why I am even talking about this in the first place. Well, do I have a story to tell for you. So sit back, relax, and maybe get those boxes of tissues ready because this is going to be quite an emotional rollercoaster.</p>
                    <p>It all happened during grade six, at the peak of COVID19— where everyone was staying at the comfort of their homes, on screens almost every single day, playing online games to still feel that sense of connection digitally. While everyone was doing their own thing, I was talking to the girl I had a crush on since grade four. Let's call her "Julie" for now. Me and Julie had been classmates since grade four up until grade six. We only started actually talking to each other during the pandemic. We were talking to each other almost every single day. We were talking about our day, our interests, the anime that we were currently watching, and many more. We were ironically learning more about each other compared to the past two years of being classmates together. We were just closer than we ever were. Unfortunately, we stopped talking during the summer. There was no bad blood between us, We just stopped talking to each other naturally… The one thing I regret the most not doing was telling her about my feelings. I was actually supposed to confess my feelings to her during Valentine's Day of that year, but there was just that one thought that was holding me back in doing so. I was scared that if I confessed my feelings to her— It would ruin the friendship we had. So I chose not to confess my feelings, and listened to my freedom of choice. Little did I know that it became one of the biggest regrets of my life later on,even looking back at it now. This whole situation made me realize that love should be unapologetic, not logical. That if you really love this person, then you should tell them how you feel before it's too late.. Even if the outcome you get was the one you did not wish for. I can understand how some people may disagree with this because they fear rejection, or detachment from the person they love, and that is totally valid. That was actually how I felt when I was in my train of thoughts whether to confess to her or not, I only realized too soon that it was better to open that jar of feelings, rather than leaving it unopened in a shelf filled with second thoughts.</p>
                `,
                wordCount: 471
            },
            5: {

                signature: "Esmero, Christian Anton T. • 12 HUMSS",
                body: `
                    <p>One of the most meaningful experiences in my life was the decision I made when I was faced with an important examination that I had been preparing for. I had a goal that I really wanted to achieve and because of that I placed a lot of pressure on myself, I thought that if I worked harder and harder, I would get the results I wanted. However, that experience taught me that not everything in life will give us the outcome we wanted, even when we do and give all our best.</p>
                    <p>Before the examination, I spent time reviewing and studying, especially my weakest and other subjects I found difficult. I knew that I was not strong on every subject the exam covers, so I tried focusing on my weaknesses. As the exam drew near, I started cramming and began to become more nervous, and started thinking about possible outcomes and whether I would succeed or fail, rather than just staying focused. At that time I was thinking more on the negative side. What would happen if I fail? It was difficult, I never want to disappoint my family, I had prepared for the exam for too long. The way I think of failing is not an option that made me develop a mentally I call the “Do not fail” type of mentality. I worked harder and harder, to prepare myself for the exam, till the point I was no longer being myself, I treated every mistake, every wrong answer from my mock test as something that would bog me down and disqualify me from passing.</p>
                    <p>During the exam, pressure was at its peak. The exam took 3 hours but it wasn’t enough to answer, and there were questions I found difficult. I had to make a decision to answer blindly or skip the question and move on. I remember feeling frustrated and fatigue, time was ticking too fast. I had to skip some questions, and the more I moved from question to question, it became more difficult, till I became tired and fatigued and couldn't think properly anymore. Then after the final minute, the exam was over.</p>
                    <p>After the examination, I sat around the campus for a while and started thinking. What happens if I fail? What do I do now? And began daydreaming about possible outcomes. Then the thought of "at least you tried” changed everything for me, because well If I never stepped up, and stayed in my comfort zone, I would have never even tried. I had the choice to decide, and to weigh out the outcome and consequences. But despite facing the fact I cannot control results and no matter how measured and hard I try, it is still not a guarantee that would pass. A failure cannot define a person as long as they persevere.</p>
                    <p>That experience taught me one thing. We cannot dictate the consequences of our actions, but consequences can dictate us. In the end, we may not be able to control what happens, but we control what we become because of it.</p>
                `,
                wordCount: 507
            },
            6: {
                id: 6,
                lastName: "GONZALEZ",
                title: "Pag-amgo: An Education in Freedom",
                date: "September 20, 2026",
                signature: "Jeremy Daniel B. Gonzalez • 12 HUMSS",
                body: `
                    <p class="font-bold italic">“You do not know what freedom is until you are required to use it for someone else.”</p>
                    <p>In November 2013, Typhoon Yolanda (internationally named ‘Haiyan’) was a long-tracked Super Typhoon that devastated the Philippines, notably Tacloban City, but less so Bogo City, while Cebu City, where I lived, came through with nothing more than strong winds and heavy rain. A few days later, after the typhoon had passed, my parents, along with a few family members, prepared to travel to Northern Cebu with volunteers from a church and asked whether I wanted to come or stay with my grandparents, who were unwell and needed someone nearby. I was still young, and I said yes for reasons that had nothing to do with duty, inasmuch as Northern Cebu was somewhere I had never been, and I simply wanted to see it. I would rather admit that than pretend otherwise. After all, how many of us only confront the suffering of others when it is presented as a curious spectacle rather than a genuine moral obligation? So, the choice was mine: my parents had left it open for me to stay and keep my grandparents company instead. I chose to travel toward the wreckage I did not yet fully understand, not knowing it would become an education in what freedom is for.</p>
                    <p>My family and I reached a relief post in the mountains outside Bogo City. My own task, most of those two days, was smaller than deciding who received what: carrying canned goods and meal packs from the boxes to the line, usually two or three at a time, and placing them directly into each person's hands, inasmuch as there was never enough to be generous with everyone. I met people who had lost their homes, including fisherfolk who, hungry and starving, arrived with a composure that almost resembled calm, describing their circumstances in ‘subdued’ voices. Carrying ration after ration under a merciless sun left my hands sore, and yet each ration also meant a family leaving that line with enough to outlast the next few days, which mattered more to me than the soreness.</p>
                    <p>What I witnessed one afternoon made the weight of it clear: a mother, holding barely enough for her own children, dividing her family's relief pack with a neighbor the distribution list had overlooked. No one asked her to. She simply did, though she had little to spare. Why do those with the least often seem to be the quickest to give? Chinese revolutionary Mao Tse Tung once wrote, “The masses are the real heroes, while we ourselves are often childish and ignorant.” Watching her, my own reasons for traveling north suddenly felt exactly that: ‘childish.’ Watching her, I understood, in whatever limited way a child understands anything, that material deprivation did not diminish a person's capacity for generosity or dignity. She also taught me something before I had words for it: that being counted correctly mattered more than I had realized. I did not know yet how soon that idea would matter again. By the next morning I wanted to stay, because helping again no longer felt like curiosity. It felt like ‘responsibility’, consciously chosen. As Jean-Paul Sartre once said, “We are left alone, without excuse,” a statement that reflects a reality that makes our freedom less of a privilege and more of an inescapable obligation to act.</p>
                    <p>That understanding sharpened further inside a ‘half-roofed’ evacuation center, where I saw a man sitting on a mat near the entrance, his shorts folded and tied off just below where his legs used to be. Being really young, my immediate, unfiltered thought was simply that it looked really ‘weird’. I caught myself staring and immediately looked away in embarrassment. Nobody explained it to me, and I did not ask. I felt unsettled, then guilty for feeling unsettled, insofar as my confusion itself was shameful. I did not have a clean word for that feeling then, and I still, till this day, do not fully have one. To wit, it was not disgust, not quite pity, but something closer to shame mixed with curiosity, the type of ‘feeling’ a child gets when something matters and they do not yet know why. A world leader once wrote in his world-famous manifesto, "Struggle is the father of all things. It is not by the principles of humanity that man lives or is able to preserve himself above the animal world, but solely by means of the most brutal struggle." I later learned neighbors had carried him through the floodwaters, since there was no other way to reach the center.</p>
                    <p>The food line that day moved in rows across the room, and his mat sat off to the side near the door, half blocked by sacks nobody had moved. I noticed, the way I had with the mother, that volunteers kept passing that corner, not out of cruelty, but by reason of it not being part of the ‘path’ anyone walked. Is neutrality just a quieter form of cruelty? I stood there deciding whether to tell an adult or do it myself, scared of both, scared it was not my job, scared of getting it wrong. I took a meal pack from the case, carried it over without being asked, and set it near his hand instead of holding it out, unsure if that part was even ‘allowed’. He nodded, said thank you, and went back to eating. As Simone Weil once said, “attention is the rarest and purest form of generosity.” I could not know what that small acknowledgement meant to him beyond the food itself, but the calm and simple way he received it, as though being noticed at all was already enough, told me that dignity does not always need grand gestures. Soviet leader Joseph Stalin once said, “a single death is a tragedy, while a million is a statistic.” The same cold math applies to the living. Sometimes dignity is restored simply by being counted as a person, not a name missing from a list. What I understood, even then, was that he had almost been missed for a reason that had nothing to do with him, only with where the room put him. I did not return from Northern Cebu unchanged, even though I was too young to name what had shifted. It has taken me years to understand what I only felt then: in view of the foregoing, responsibility is not about what a society claims to value, but whether the people it is quickest to forget stay protected when everything else falls apart. I went north as a child chasing something new and came back, however unknowingly, with a heart trained to look for the overlooked, and a standard, understood only later, that a choice made in service of another's dignity is one I am obligated to keep living up to, whether that means noticing the classmate left out of a group project or the neighbor left off a barangay list, and refusing to let anyone stay ‘invisible’ because no one thought to look.</p>
                    <p class="font-italic">"There are risks and costs to action, but they are far less than the long-range risks of comfortable inaction." The floodwaters eventually receded. The physical wreckage was cleared. But the inevitable, subtle disaster of human indifference, continues to remain. I traveled north to exercise a child’s simple freedom to go, only to finally learn what that freedom was actually for. As Martin Luther King Jr. famously challenged, “Life’s most persistent and urgent question is: What are you doing for others?” And I ask you: If your freedom serves only your own comfort, is it liberty, or merely a ‘privilege?’ If a person is rendered invisible by a system, are you complicit when you refuse to step off the path to see them? If human dignity is restored simply by being counted, how many have you passively erased from the room? If the wreckage of another’s life does not demand your attention, what exactly does it take to move you? And if you are not looking for the overlooked, who exactly are you choosing to look away from? The wreckage will eventually clear, but your answer never will.</p>
                    <p class="text-right font-bold">Non nobis solum nati sumus – Cicero</p>
                `,
                wordCount: 1284
            },

                    <p>Delivering meals brought joy and sadness. The food brought us the opportunity to make an impact and bring people Christmas joy, however it was sad to know many people depend on us to give them a Christmas meal. There were people who looked tired and had very little. Seeing this really made me thankful for the many things I have. I know I'm very blessed and fortunate to have the life I have.</p>

                    <p>I started to think about the results of my actions. I had not thought about this before and took action to give out meals on Christmas. I learned that many small acts of kindness and giving can greatly and really impact people and change their day for the better. I learned to not always give large gifts to people to show I care. I took less for granted and gave more in an effort to treat others the way I want to be treated.</p>

                signature: "Aruta, Fabei Kirstenn B. • 12 HUMSS",
                body: `
                    <p>One experience that I still remember from my Junior High School days was when I witnessed a girl with a disability having a difficult time with a school task. Although it was not a significant matter, I do appreciate the choice I made at that moment and how it affected that girl.</p>
                    <p>At that time, I was still young, and I was learning how to be more sensitive to the needs of others. When I saw that girl having a hard time in a crowded place where many things were scattered, I felt that I should assist her. However, I hesitated a bit because I did not know how she would react to my offer of help. For a moment, I thought that it would be better to just focus on my own task and leave her alone, hoping that someone would assist her instead.</p>
                    <p>Nevertheless, the thought of ignoring that girl was quickly replaced with a feeling of responsibility and concern for her. I knew that I would not forgive myself if I just walked away, seeing that she was in need of assistance while I had the opportunity to help. So, I went to her and asked if she needed help, and she agreed. I helped to remove the scattered objects from her way and made sure she could pass.</p>
                    <p>Although it was a minor thing I did to help, I felt so happy and grateful for what I had done. Moreover, I was satisfied that I did not give up on my initial decision to help that girl. I learned that day that freedom means making your own choices and deciding for yourself. What I did was a wise decision because I followed my own judgment and did what I genuinely wanted to do. I could have ignored that girl and no one would have blamed me for being selfish and self-centered, but I chose to be compassionate and kind.</p>
                    <p>In addition, my decision was driven by my inner values of being kind and supportive to everyone regardless of their social status, gender, or disability.</p>
                    <p>I believe that everyone deserves respect, even those who are disabled. Since they are still human beings, they should be treated equally as those who do not have disabilities. I did not want the girl to feel as if she is not worthy or as if her disability defines who she is. Therefore, I respected her by taking care of her needs by removing the obstacles from her way.</p>
                    <p>Moreover, I believe my experience taught me a valuable lesson about our concept of freedom. We should use our freedom to make our own choices wisely. We should not abuse our freedom to do whatever we want just because we are allowed to.</p>
                    <p>Furthermore, I learned through that incident that helping people with disabilities is not always about doing big things to prove to them that they are worthy. Sometimes, it could be as simple as providing them with the moral support they need or giving them the required assistance when they ask for it. Helping people with disabilities is a sensitive matter, and we should not treat those disabled people as if they are incompetent. We should not make assumptions about what they can or cannot do. We should treat them as normal human beings who deserve our respect, compassion, and support when it is needed.</p>
                    <p>Actually, it was also a great lesson about appreciating my own family. Through that incident, I learned that helping disabled people should not be limited to doing big things for them. Sometimes, it could be just small acts of kindness that show them they are cared for and that they are not alone. Furthermore, I learned that helping disabled people makes a great difference in their lives. They are humans just like anyone else, and they deserve to be treated equally.</p>
                    <p>When I think about the incident, I still find it hard to believe that I actually helped that girl, but I am so glad that I did what I did. It was a great lesson that helped me change my perception about disabled people. I realized through that incident that my freedom does not mean doing whatever I want, whenever I want, but it also means making wise decisions when making a choice between two different options.</p>
                    <p>It was truly a great experience I had when I was still in Junior High School, and I do believe it had a big impact on my character. It taught me to be a better person who cares about other people’s feelings and a better citizen who respects others. It made me more conscious about my decisions, especially regarding those who are disabled. After all, we should accept that they are human beings just like the rest of us and they deserve to be treated equally. Most importantly, I learned that when we have the ability to help, it is a moral obligation to do so since helping them is sometimes the only thing that can make their day better.</p>
                `,

            12: {
                id: 12,
                lastName: "DELA TORRE",
                title: "My Lola",
                date: "September 21, 2026",
                signature: "Dela Torre, Xeaniel Rose B. • 12 HUMSS",
                body: `
                    <p>My Lola was someone I remember finding really cool when I was younger.</p>
                    <p>Whenever my family visited her home, she would always offer lots snacks to my younger sister and I. She also had a backyard with chickens and stray animals that liked to visit the area to relax. Younger me found it amazing! Like a mini farm! It was one of the many parts of her home that I found really entertaining back then.</p>
                    <p>But despite the many fond memories I have of my Lola’s home, I struggle to recall any actual conversations that I had with her. She would usually be talking to my parents or her other children. But I don’t think younger me minded that much; I just assumed we would get closer over time.</p>
                    <p>I don’t remember how it started, but the time for us to get closer eventually happened. Lola started living in our home.</p>
                    <p>There, lying on a bed in the living room, was my Lola. Unable to stand and walk on her own and was a lot quieter than usual. According to my mother, she had suffered a stroke and was now unable to properly speak. I remember being confused and very surprised. The healthy Lola I had visited just a few months ago was now living with us and very different from how I remembered her to be. My family and I were now in charge of taking care of Lola, ensuring that she lived as comfortably as possible.</p>
                    <p>I quickly grew used to living with her, and I found myself learning about her many sides. All of which I had never seen before during our visits to her home.</p>
                    <p>My image of Lola was someone patient, wise, and someone to hold in high regard. So you could only imagine my surprise when I found out she had been hiding the TV remote from my younger sister and me so she could keep watching the shows she liked! Not to mention, the confusion I felt when she would repeatedly nudge me from behind and pretend she didn’t do it! These were only some of the playful and funny sides to her that I happily discovered during the time we spent together.</p>
                    <p>Of course, there were also sides to my Lola that weren’t always nice.</p>
                    <p>Times when she would get angry over things, times when she would stubbornly refuse our care, and times when she would quietly cry over things I couldn’t understand. I was just too young to understand. But these moments made even younger me remember that my Lola was a human just like me. Someone who, despite being the strongest person I knew, was pained and frustrated by the situation she was in.</p>
                    <p>Younger me was never really aware of the true gravity of Lola’s situation. Even when she got diagnosed with tongue cancer, I simply assumed she would get better if we looked after her for longer. The concept of death was foreign to me. While I acknowledged its existence, I never truly understood what it really meant to have someone you love slowly get closer to dying.</p>
                    <p>Reality started to sink in when I saw Lola getting weaker with each passing day. While death was not the conclusion that came to mind, I realized that my Lola was suffering more as time passed. I decided to put more effort into being there for her. I spent more time with her, laughed with her, and helped my parents take care of her. Using the freedom that I had, I tried my best to make my moments with her memorable, hoping it would make her life feel a bit easier.</p>
                    <p>After some time, my Lola passed away.</p>
                    <p>It took me a very long time to fully accept her death. Even today, I still struggle to look back on the times I spent with her without any regrets. But I believe that the time we spent together was not meaningless or only depressing by any means. The experiences and memories I made with her, both good and bad, are ones that I will forever hold close to my heart and cherish dearly.</p>
                    <p>I learned a lot from my memories with Lola. It's because of her that I'm able to use my free will to offer help and comfort to those that I love. Because of this, she is someone I will always be grateful to have met in my life.</p>
                `,
                wordCount: 704
            },

                signature: "Lyka Mae Dicdican • 12 HUMSS",
                body: `
                    <p>One meaningful experience in my life was when I decided to continue with my studies even when I was already feeling tired and overwhelmed. As a Grade 12 student, there are times when school becomes stressful because of different activities, deadlines, group works, and personal problems. There was a time when I felt like I could not handle everything anymore. I became unmotivated and started questioning if I could really finish everything.</p>

                    <p>Some students may be dealing with problems at home, financial difficulties, disabilities, or other struggles that we cannot see.</p>
                    <p>Because of this, I learned to have more understanding toward persons with disabilities and people from underprivileged communities. They may have fewer opportunities or face challenges that other people do not experience. This made me realize that not everyone starts from the same situation. Sometimes, a choice that seems easy for one person can be difficult for someone else because of their circumstances.</p>
                    <p>For me, freedom of choice means having the ability to make decisions while also accepting their consequences. I had the freedom to give up, but I also had the freedom to continue. I chose to continue because I knew that my future would also depend on the choices I make today.</p>
                    <p>Looking back, I am glad that I chose not to give up. This experience taught me that difficult situations can help us become stronger and more understanding. It also showed me that even one decision can make a big difference in how we see ourselves, other people, and our own struggles. I learned that we may not always control what happens to us, but we can still choose how we respond to it.</p>

            14: {
                id: 14,
                lastName: "GABIA",
                title: "More Than What the Eyes Can See",
                date: "September 19, 2026",
                signature: "Gabia, Shyrinne C. • 12 HUMSS",
                body: `
                    <p>An experience that really changed what freedom and responsibility meant to me was when a friend and I were heading back to Cebu City. We had gone home to visit family over Holy Week, which meant the bus terminal was crowded and overwhelming. Many passengers were waiting, and the lines were extremely long. My friend has an autoimmune disease that causes her to get exhausted fast. However, because her condition is not physically obvious, people usually assume that she is completely fine. That day became important to me because I had to choose whether I had to stay quiet and avoid attention or speak up for my friend when she was being unfairly judged.</p>
                    <p>While we were waiting at the terminal, I could already see that my friend was physically exhausted. The regular line was long, and I was worried that staying there for too long might make her condition worse. She was hesitant to use the PWD area because she was afraid that people might judge her. Since her condition is not visible, she was worried that others would question why she was using a space intended for persons with disabilities. Even so, I encouraged her to go to the PWD area because I knew that she had the right to use the accommodation and because I wanted her to be able to sit and rest while waiting. When we went to the PWD area, a man looked at us and questioned why we were there. He assumed that neither of us had a disability because we looked physically fine. We respectfully explained that my friend had a medical condition and showed her PWD card. However, instead of accepting our explanation, he accused us of using a fake PWD card just to receive discounts and other privileges. His voice became louder, and he called the conductor. The conductor also questioned the validity of the card and accused us of pretending that my friend was a PWD. At that time, I noticed that my friend was getting more anxious, and later she told me that we should leave the PWD area to avoid the attention. I knew I had a choice. I could have stayed silent and walked away with my friend, but I couldn't bring myself to do it. Even though I feared the argument would escalate or that people would judge us, leaving felt wrong.</p>
                    <p>Thankfully, there was a standby police officer in the area. I explained the whole situation to him. I made sure he understood that we were saying the right thing, that we weren't pulling anything shady, and that my friend's PWD card was not fake. Unlike the others, he listened to us attentively and understood what had happened. He even told us that we could file a report against the man and the conductor. Although we decided not to file one, the situation taught me a lot. It made me realize that not every disability can be seen by our naked eye alone. I knew that people with disabilities can face different challenges, but I did not realize how difficult it could be to have other people question your condition just because you do not look disabled in their judgment.</p>
                    <p>The situation also made me realize the true meaning of freedom of choice in a more personal way. Before, I mostly thought of freedom as being able to choose whatever I wanted to do. But that incident taught me that freedom always also comes with great responsibility. I had the choice to stay silent because it would have been less embarrassing, but I chose to speak up because I knew my decision could affect my friend. I was terrified I’d mess up and say the wrong thing, only making the whole situation worse. But I also knew that staying quiet means allowing them to continue treating her unfairly. Looking back, that experience taught me to stop judging people by what I see on the surface, because you never know what someone is going through internally. Above all, it changed my understanding of freedom. It isn't just doing whatever you want, it's caring about how your own choices affect others and taking responsibility for the paths you choose to take.</p>
                `,

                    <p class="font-bold">August 13, 2026</p>
                    <p>Hello blog! Today I wanted to share a little encounter I had while going home.</p>
                    <p>So here’s what happened. That morning, my parents told me to come home early because they had a business meeting, and my brother would be left alone. So the second our last class ended, I headed straight to the v-hire terminal.</p>
                    <p>While I was waiting in line, I noticed a man from the corner of my eye. He kept hesitating, like he wanted to approach me but wasn’t sure. Honestly, I was hesitating too. Should I ask if he needed something, or wait for him to make the first move? Before I could decide, he tapped my shoulder and pointed at his phone. The screen read “Cordova?”</p>
                    <p>I recognized him right away. He’s the deaf worker at Orange Brutus. So I nodded, no hesitation, and smiled. He nodded back and smiled too.</p>
                    <p>A few minutes later, a guy and his friend came up to him, asking where this line was going. He motioned that he was deaf, so I stepped in and answered for him. Then, less than five minutes later, a girl asked if this was the line for the Cordova v-hire. Again, he motioned that he was deaf. Again, I stepped in.</p>
                    <p>Then came the moment that stuck with me. A woman in her fifties approached him and asked, in Tagalog, where this line was going. I froze for a second.</p>
                    <p>…Not because I didn’t understand her. I did. But because I wasn’t the best at speaking Tagalog, and I knew whatever came out of my mouth might not sound smooth.</p>
                    <p>Still, I stepped in anyway and said, “Hindi po, para Cordova po to.” She nodded and started ranting about how she couldn’t find the line for Danao. So I pointed her in the right direction and told her where to go. She said “salamat” and walked off.</p>
                    <p>And you know what? I could've just stood there and let things happen. Nobody would've blamed me. But I thought about what it must feel like to be the deaf worker at Orange Brutus, going through this every single day. People not knowing how to talk to him. People getting impatient. People assuming things about him. And then I thought about that woman, probably tired and confused, in a place she didn't know well, having to ask strangers for help.</p>
                    <p>Looking back, I didn't just help one person that day. I helped the deaf worker every time someone asked him a question. I helped the guy and his friend, and the girl, by answering for him so they didn't have to struggle. And I helped the woman find her way to Danao, even when I was scared my Tagalog wouldn't come out right.</p>
                    <p>That day, I realized something. Freedom isn't just about doing what you want. It's about noticing when someone needs help and choosing to be the one who gives it. I didn't have to help. But I did. And that choice felt bigger than just answering a few questions. It felt like I was saying, "I see you, and you matter." A little dramatic, but that’s how I truly feel.</p>

                    <p>One meaningful experience that shaped me into who I am today was when I was young I entered a relationship assuming that it was genuine and healthy. During that time, I was immature, naive, and young. I lacked experience to truly understand romantic relationships or recognize something that genuinely seemed good, and then it eventually became an unhealthy and toxic relationship. I genuinely cared about the person, and my motivation for staying was the happiness and connection I felt in the relationship. I believed that if I cared about someone, I should remain loyal and committed to them. Because of this, I held on even when things slowly began to change.</p>

                    <p>I would like to share with you an experience from my life that taught me a lesson concerning freedom of choice. The event took place last year, while I was in my first year of senior high school. I met a group of classmates that I grew extraordinarily close to. We would hang out together in class, make comments to each other, and talk to each other after school. We were closer than ever a few months ago. We talked to each other daily and made plans together. I had so much fun being a part of that circle of friends. However, that all changed, and fast.</p>
